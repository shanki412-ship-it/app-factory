<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;600;700&display=swap">
<script>try{var t=localStorage.getItem('app_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
/* Playful blocks theme (from FitBull): cream background, pastel blocks, black pills. Dark mode follows the phone. */
:root{ --bg:#FBF5EA; --card:#FFFFFF; --ink:#1C1A17; --muted:#6B655B; --line:rgba(28,26,23,.12); --pill:#1C1A17; --pillink:#FFFFFF; --red:#C8332B;
  --sun:#F9D648; --pink:#F6B5D6; --sage:#B5CC8E; --lav:#C5CBF6; --salmon:#F4A99C; --mint:#A8E3D0; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#12110E; --card:#1F1D19; --ink:#F4EFE6; --muted:#A39C90; --line:rgba(244,239,230,.12);
  --pill:#F4EFE6; --pillink:#1C1A17; --red:#E0544B; --sun:#E3C33F; --pink:#E49CC2; --sage:#9EBA78; --lav:#AAB2EE; --salmon:#E6918A; --mint:#8ED1BC; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#12110E; --card:#1F1D19; --ink:#F4EFE6; --muted:#A39C90; --line:rgba(244,239,230,.12);
  --pill:#F4EFE6; --pillink:#1C1A17; --red:#E0544B; --sun:#E3C33F; --pink:#E49CC2; --sage:#9EBA78; --lav:#AAB2EE; --salmon:#E6918A; --mint:#8ED1BC; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'DM Sans',-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:0 14px 96px}
h1,h2,.brand b{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
/* header + menu */
header{position:sticky;top:0;z-index:20;margin:0 -14px 10px;background:var(--card);border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(28,26,23,.07);padding:calc(env(safe-area-inset-top) + 8px) 14px 6px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand b{font-size:19px;font-weight:800}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.themebtn{margin-left:auto;flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}
.themebtn svg,nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav{display:flex;gap:4px;margin-top:6px}
nav button{flex:1;border:0;background:none;border-radius:16px;padding:8px 0 6px;font:600 12px 'DM Sans',sans-serif;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{background:var(--pill);color:var(--pillink)}
nav button.bounce svg{animation:iconpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes iconpop{40%{transform:scale(1.3)}}
/* cards and colour blocks */
.card{background:var(--card);border-radius:26px;box-shadow:0 2px 12px rgba(28,26,23,.06);padding:16px;margin:12px 0;animation:rise .35s ease-out both}
.blk{--ink:#1C1A17;--muted:#4A453D;--line:rgba(28,26,23,.14);--pill:#1C1A17;--pillink:#FFFFFF;color:#1C1A17;box-shadow:none}
.sun{background:var(--sun)} .lav{background:var(--lav)} .mint{background:var(--mint)} .pink{background:var(--pink)} .sage{background:var(--sage)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:#1C1A17;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px}
textarea{min-height:80px;resize:vertical}
.btn{width:100%;border:0;border-radius:999px;padding:14px;font:700 16px 'DM Sans',sans-serif;background:var(--pill);color:var(--pillink);cursor:pointer}
.btn:disabled{opacity:.6}
.item{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .info{flex:1;min-width:0}.item .name{font-weight:700;overflow-wrap:anywhere}.item .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ibtn{border:0;background:var(--bg);color:var(--red);border-radius:999px;padding:8px 12px;font:600 14px 'DM Sans',sans-serif;flex:none;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.reply{white-space:pre-wrap;margin-top:12px}
.empty{text-align:center;padding:18px 0;color:var(--muted)}
.view{display:none}.view.on{display:block}
.skel{height:18px;border-radius:9px;background:var(--line);margin:10px 0;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--pill);color:var(--pillink);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:50}
.toast.show{opacity:1;animation:toastpop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes toastpop{0%{transform:translateX(-50%) scale(.8)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <b id="appName">{{APP_NAME}}</b><span id="tagline">{{TAGLINE}}</span>
      <button class="themebtn" id="themeBtn" aria-label="Switch light or dark">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <nav>
      <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button data-tab="ask"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18 9.4l-4.2 1.8L12 16l-1.8-4.8L6 9.4l4.2-1.8z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Ask AI</button>
    </nav>
  </header>

  <!-- Home: add and list items -->
  <section class="view on" id="view-home">
    <div class="card blk sun">
      <h2>Add an item</h2>
      <label for="itemIn">Item</label>
      <input id="itemIn" maxlength="200" placeholder="What do you want to save?" autocomplete="off">
      <label for="notesIn">Notes (optional)</label>
      <input id="notesIn" maxlength="500" autocomplete="off">
      <button class="btn" id="addBtn">Add</button>
    </div>
    <div class="card">
      <h2>Saved</h2>
      <div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </div>
  </section>

  <!-- Ask AI -->
  <section class="view" id="view-ask">
    <div class="card blk lav">
      <h2>Ask AI</h2>
      <p class="small" id="aiNote" style="margin-top:-4px">Gemini can see your saved items.</p>
      <textarea id="askIn" maxlength="2000" placeholder="Ask anything about your items…"></textarea>
      <button class="btn" id="askBtn">Ask</button>
      <div class="reply" id="reply"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// google.script.run as a promise: call('webGetHome').then(…)
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e && e.message ? e : new Error(String(e))); });
    r[fn].apply(r, args);
  });
}
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var toastTimer;
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600); }
function fail(e) { toast((e && e.message ? e.message : String(e)).replace(/^Exception: /, '')); }

// tabs
document.querySelectorAll('nav button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('on', x === b); });
    document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('on', v.id === 'view-' + b.dataset.tab); });
    b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce');
    window.scrollTo(0, 0);
  });
});

// light / dark
$('themeBtn').addEventListener('click', function () {
  var dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  var next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('app_theme', next); } catch (e) {}
});

// home
function render(d) {
  $('appName').textContent = d.app; $('tagline').textContent = d.tagline || '';
  $('aiNote').textContent = d.aiOn ? 'Gemini can see your saved items.' : 'AI is off – in the Sheet choose ' + d.app + ' ▸ 🔑 Set Gemini key.';
  $('list').innerHTML = d.items.length ? d.items.map(function (it) {
    return '<div class="item"><div class="info"><div class="name">' + esc(it.item) + '</div><div class="meta">' + esc(it.date) +
      (it.notes ? ' · ' + esc(it.notes) : '') + '</div></div><button class="ibtn" data-del="' + esc(it.id) + '">Delete</button></div>';
  }).join('') : '<div class="empty">Nothing saved yet.</div>';
}
$('list').addEventListener('click', function (e) {
  var b = e.target.closest('[data-del]'); if (!b) return;
  b.disabled = true;
  call('webDeleteItem', b.dataset.del).then(function (d) { render(d); toast('Deleted'); }).catch(function (err) { b.disabled = false; fail(err); });
});
$('addBtn').addEventListener('click', function () {
  var item = $('itemIn').value.trim(); if (!item) { $('itemIn').focus(); return; }
  var b = $('addBtn'); b.disabled = true;
  call('webAddItem', item, $('notesIn').value).then(function (d) {
    $('itemIn').value = ''; $('notesIn').value = ''; render(d); toast('Saved ✓');
  }).catch(fail).then(function () { b.disabled = false; });
});
$('itemIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('addBtn').click(); });

// ask
$('askBtn').addEventListener('click', function () {
  var q = $('askIn').value.trim(); if (!q) { $('askIn').focus(); return; }
  var b = $('askBtn'); b.disabled = true; b.textContent = 'Thinking…'; $('reply').textContent = '';
  call('webAsk', q).then(function (a) { $('reply').textContent = a; }).catch(fail)
    .then(function () { b.disabled = false; b.textContent = 'Ask'; });
});

call('webGetHome').then(render).catch(function (e) { $('list').innerHTML = '<div class="empty">Couldn\'t load – ' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
